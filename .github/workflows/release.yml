name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_type:
        description: Release Type
        required: true
        default: nightly
        type: choice
        options:
          - nightly
          - stable

permissions:
  contents: write
  packages: write

concurrency:
  group: er-startseite-release
  cancel-in-progress: false

jobs:
  release:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.release.prerelease == true && contains(github.event.release.tag_name, '-nightly.')) ||
      (github.event.release.prerelease == false && !contains(github.event.release.tag_name, '-'))
    name: Build & Push Release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Determine Version
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TYPE: ${{ inputs.release_type }}
          RUN_ID: ${{ github.run_id }}.${{ github.run_attempt }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            VERSION=$(python3 scripts/version_manager.py --action calculate --type "$RELEASE_TYPE" --run-id "$RUN_ID")
            IS_PRERELEASE="false"
            if [[ "$RELEASE_TYPE" == "nightly" ]]; then
              IS_PRERELEASE="true"
            else
              python3 scripts/version_manager.py --action write --version "$VERSION"
            fi
          else
            VERSION="${RELEASE_TAG#v}"
            if [[ "$VERSION" =~ ^[0-9]{4}\.(0?[1-9]|1[0-2])\.[1-9][0-9]*$ ]]; then
              [[ "$RELEASE_PRERELEASE" == "false" ]] || {
                echo "Stable tags cannot be marked prerelease." >&2
                exit 1
              }
              IS_PRERELEASE="false"
            elif [[ "$VERSION" =~ ^[0-9]{4}\.(0?[1-9]|1[0-2])\.[1-9][0-9]*-nightly\.[0-9]{8}\.[0-9]{4}(\.[0-9]+)*$ ]]; then
              [[ "$RELEASE_PRERELEASE" == "true" ]] || {
                echo "Nightly tags must be marked prerelease." >&2
                exit 1
              }
              IS_PRERELEASE="true"
            else
              echo "Unsupported release tag: $RELEASE_TAG" >&2
              exit 1
            fi
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "is_prerelease=$IS_PRERELEASE" >> "$GITHUB_OUTPUT"

      - name: Commit Stable Version Mirrors
        if: github.event_name == 'workflow_dispatch' && inputs.release_type == 'stable'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add VERSION backend/pyproject.toml frontend/package.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(release): bump version to $VERSION"
            git push
          fi

      - name: Create Tag (Manual)
        if: github.event_name == 'workflow_dispatch'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          TAG="v${VERSION}"
          if git show-ref --verify --quiet "refs/tags/${TAG}"; then
            echo "Tag already exists: ${TAG}" >&2
            exit 1
          fi
          git tag "$TAG"
          git push origin "refs/tags/${TAG}"

      - name: Generate Release Notes (Manual)
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Release v${{ steps.version.outputs.version }}
          prerelease: ${{ steps.version.outputs.is_prerelease }}
          make_latest: ${{ steps.version.outputs.is_prerelease == 'false' && 'true' || 'false' }}
          generate_release_notes: true

      - name: Check Docker Hub Credentials
        id: check_dockerhub
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: |
          if [[ -n "$DOCKER_USERNAME" && -n "$DOCKER_PASSWORD" ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: steps.check_dockerhub.outputs.available == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Images
        env:
          VERSION: ${{ steps.version.outputs.version }}
          IS_PRERELEASE: ${{ steps.version.outputs.is_prerelease }}
          REPOSITORY: ${{ github.repository }}
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKERHUB_AVAILABLE: ${{ steps.check_dockerhub.outputs.available }}
        run: |
          REPO_GHCR="ghcr.io/$(printf '%s' "$REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          REPO_NAME="$(printf '%s' "${REPOSITORY#*/}" | tr '[:upper:]' '[:lower:]')"
          REPO_DH=""
          if [[ "$DOCKERHUB_AVAILABLE" == "true" ]]; then
            REPO_DH="$DOCKER_USERNAME/$REPO_NAME"
          fi

          for SERVICE in backend frontend; do
            TAG_ARGS=("--tag" "$REPO_GHCR/$SERVICE:$VERSION")
            if [[ "$IS_PRERELEASE" != "true" ]]; then
              TAG_ARGS+=("--tag" "$REPO_GHCR/$SERVICE:latest")
            fi

            if [[ -n "$REPO_DH" ]]; then
              TAG_ARGS+=("--tag" "$REPO_DH/$SERVICE:$VERSION")
              if [[ "$IS_PRERELEASE" != "true" ]]; then
                TAG_ARGS+=("--tag" "$REPO_DH/$SERVICE:latest")
              fi
            fi

            BUILD_ARGS=()
            if [[ "$SERVICE" == "backend" ]]; then
              BUILD_ARGS+=("--build-arg" "APP_VERSION=$VERSION")
            fi

            docker buildx build \
              --push \
              --platform linux/amd64,linux/arm64 \
              "${BUILD_ARGS[@]}" \
              "${TAG_ARGS[@]}" \
              "./$SERVICE"
          done
